version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: quantscope_user
      POSTGRES_PASSWORD: quantscope_password
      POSTGRES_DB: quantscope
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://quantscope_user:quantscope_password@db:5432/quantscope
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
